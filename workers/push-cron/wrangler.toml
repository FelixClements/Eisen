"$schema" = "../../node_modules/wrangler/config-schema.json"
name = "eisen-push-cron"
main = "src/index.ts"
compatibility_date = "2025-07-18"

[triggers]
crons = ["* * * * *"]

[vars]
# Must match production BETTER_AUTH_URL (custom domain or Pages URL, no trailing slash)
TARGET_ORIGIN = "https://eisen-web.pages.dev"

[secrets]
required = ["CRON_SECRET"]
