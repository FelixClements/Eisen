<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/icon-192x192.png" type="image/png" sizes="192x192" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" sizes="180x180" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-167x167.png" sizes="167x167" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-152x152.png" sizes="152x152" />
		<link rel="apple-touch-icon" href="/apple-touch-icon-120x120.png" sizes="120x120" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap"
			rel="stylesheet"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="Eisenhower matrix task manager with encrypted sync" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0f766e" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Eisen" />
		<script>
			(function () {
				var KEY = 'eisen-appearance';
				function detect() {
					var ua = navigator.userAgent;
					if (/android/i.test(ua)) return 'material';
					if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
					return 'ios';
				}
				function resolve(mode) {
					return mode === 'system' ? detect() : mode;
				}
				var stored = localStorage.getItem(KEY);
				var mode =
					stored === 'ios' || stored === 'material' || stored === 'system' ? stored : 'system';
				var theme = resolve(mode);
				var root = document.documentElement;
				root.classList.add(theme === 'material' ? 'md' : 'ios');
				root.dataset.eisenTheme = theme;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
