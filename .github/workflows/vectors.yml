name: Cross-Platform Vectors

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  vectors:
    name: Core vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run core vector tests
        shell: bash
        working-directory: ./core
        run: cargo test --test vectors -- --nocapture 2>&1 | tee "vector-${{ matrix.os }}.log"
      - name: Upload vector report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vector-log-${{ matrix.os }}
          path: core/vector-*.log
