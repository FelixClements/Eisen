name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository boundaries
        run: ./tools/verify-structure.sh

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: '**/*.md'

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify LICENSE exists
        run: test -s LICENSE

  android-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android lint
        working-directory: ./clients/android
        run: ./gradlew lint

  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests
        working-directory: ./clients/android
        run: ./gradlew testDebugUnitTest

  pwa-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./clients/pwa-svelte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./clients/pwa-svelte/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Svelte/TypeScript
        run: npm run check
      - name: Build for Cloudflare
        run: npm run build
      - name: Upload Cloudflare build
        uses: actions/upload-artifact@v4
        with:
          name: pwa-cloudflare-build
          path: ./clients/pwa-svelte/.svelte-kit/cloudflare
          retention-days: 1

  pwa-deploy:
    runs-on: ubuntu-latest
    needs: pwa-check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ./clients/pwa-svelte
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./clients/pwa-svelte/package-lock.json
      - name: Download Cloudflare build
        uses: actions/download-artifact@v4
        with:
          name: pwa-cloudflare-build
          path: ./clients/pwa-svelte/.svelte-kit/cloudflare
      - name: Install Wrangler
        run: npm ci
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy .svelte-kit/cloudflare --project-name=eisen-svelte-pwa --branch=main

  dependency-scan:
    runs-on: ubuntu-latest
    if: hashFiles('**/Cargo.lock', '**/go.sum', '**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml', '**/Gemfile.lock', '**/Pipfile.lock', '**/poetry.lock', '**/requirements*.txt', '**/gradle.lockfile') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Run OSV dependency scan
        uses: google/osv-scanner-action@v2
        with:
          scan-args: '-r .'

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom

  protocol-stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protocol and test boundaries
        run: ./tools/verify-protocol-stubs.sh
